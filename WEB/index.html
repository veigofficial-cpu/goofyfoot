<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goofy Foot® — Pine Wood Room Spray</title>
    <meta name="description" content="7년을 기다려 만나는, 여름 소나무 숲의 향. GOOFY FOOT® PINE WOOD ROOM SPRAY">
    
    <!-- Fonts: Adobe Typekit Acumin Pro + Pretendard Variable -->
    <link rel="stylesheet" href="https://use.typekit.net/mba8czj.css">
    <link rel="stylesheet" href="pretendardvariable.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECTION 1: HERO COVER -->
    <section class="section-hero" id="hero">
        <h1 class="brand-title">Goofy Foot<sup>®</sup></h1>
        
        <div class="cicada-icon" aria-label="Goofy Foot Cicada Emblem">
            <svg width="24" height="34" viewBox="0 0 24 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4M12 6C8 6 5 9 5 14v10c0 4 3 6 7 6s7-2 7-6V14c0-5-3-8-7-8z"/>
                <path d="M5 14c-2 2-3 5-3 8M19 14c2 2 3 5 3 8"/>
                <path d="M5 18h14M5 22h14M5 26h14"/>
                <path d="M9 2L7 0M15 2l2-2"/>
            </svg>
        </div>

        <a href="#interaction" class="scroll-explore" id="link-explore">
            <span>EXPLORE</span>
            <span class="arrow-down">∨</span>
        </a>
    </section>

    <!-- SECTION 2: SPRAY REVEAL INTERACTION -->
    <section class="section-interaction" id="interaction">
        <div class="spray-reveal-container" id="spray-container">
            <!-- 숨겨진 이미지 (클릭/터치로 스프레이하면 드러남) -->
            <img src="images/pine_tree.png" alt="Goofy Foot Pine Wood Illustration" class="reveal-image" id="reveal-image">
            <!-- 흰색 마스크 캔버스 (스프레이로 지워짐) -->
            <canvas id="spray-canvas"></canvas>
            <!-- 안내 텍스트 -->
            <div class="spray-hint" id="spray-hint">
                <span>CLICK TO SPRAY</span>
            </div>
        </div>
    </section>

    <!-- SECTION 3: BRAND STORY -->
    <section class="section-story" id="story">
        <div class="story-container">
            <span class="story-tag">THE STORY</span>
            <div class="story-content">
                <p>국립생물자원관에 따르면, 매미는 땅속에서 최대 7년을 기다린다.</p>
                <br>
                <p>7년의 어둠, 그리고 지상에서 주어진 시간은 단 한 계절.<br>
                깨어난 매미는 숲에서 가장 향이 짙은 나무를 찾아 오른다.</p>
                <br>
                <p class="highlight">언제나, 소나무다.</p>
                <br>
                <p>
                    <strong>GOOFY FOOT<sup>®</sup> PINE WOOD ROOM SPRAY</strong>는<br>
                    그 한 계절의 공기를 담았다.
                </p>
                <br>
                <p>7년을 기다려 만나는, 여름 소나무 숲의 향.</p>
            </div>
        </div>
    </section>

    <!-- SECTION 4: BRAND PRODUCT PHOTOS -->
    <section class="section-products" id="products">
        <div class="products-grid-2col">
            <div class="product-box">
                <img src="images/product 1.png" alt="Goofy Foot Pine Wood Room Spray Bottle">
            </div>
            <div class="product-box">
                <img src="images/package 1.png" alt="Goofy Foot Room Spray Package">
            </div>
        </div>
    </section>

    <!-- SECTION 5: BRAND STORE LINK & FOOTER -->
    <section class="section-store-footer" id="store">
        <a href="https://smartstore.naver.com" target="_blank" rel="noopener noreferrer" class="btn-store" id="btn-smart-store">
            Goofy Foot Smart Store
        </a>

        <footer class="site-footer">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="footer-link" id="link-instagram">INSTAGRAM</a>
            <a href="mailto:contact@goofyfoot.com" class="footer-link" id="link-email">EMAIL</a>
        </footer>
    </section>

    <script src="main.js"></script>
</body>
</html>
